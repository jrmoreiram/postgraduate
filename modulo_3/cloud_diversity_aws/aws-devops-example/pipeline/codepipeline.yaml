AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for AWS CodePipeline

Parameters:
  EnvironmentName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: devops-example
  CodePipelineServiceRoleArn:
    Description: ARN of the CodePipeline Service Role
    Type: String
  CodePipelineArtifactsBucketName:
    Description: Name of the S3 bucket for CodePipeline artifacts
    Type: String
  GitHubOwner:
    Description: The owner of the GitHub repository (e.g., your-github-username)
    Type: String
  GitHubRepo:
    Description: The name of the GitHub repository (e.g., aws-devops-example)
    Type: String
  GitHubBranch:
    Description: The branch of the GitHub repository to use (e.g., main)
    Type: String
    Default: main
  GitHubToken:
    Description: A GitHub Personal Access Token with repo scope. Store in AWS Secrets Manager for production.
    Type: String
    NoEcho: true
  CodeBuildProjectName:
    Description: Name of the CodeBuild project
    Type: String
  CodeDeployApplicationName:
    Description: Name of the CodeDeploy application
    Type: String
  CodeDeployDeploymentGroupName:
    Description: Name of the CodeDeploy deployment group
    Type: String

Resources:
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${EnvironmentName}-CodePipeline'
      RoleArn: !Ref CodePipelineServiceRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactsBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Ref GitHubToken
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref CodeBuildProjectName
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ApplicationName: !Ref CodeDeployApplicationName
                DeploymentGroupName: !Ref CodeDeployDeploymentGroupName
              RunOrder: 1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-CodePipeline'

Outputs:
  CodePipelineName:
    Description: Name of the CodePipeline
    Value: !Ref CodePipeline
    Export:
      Name: !Sub '${EnvironmentName}-CodePipelineName'
