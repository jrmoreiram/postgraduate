AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for S3 bucket to store CodePipeline artifacts

Parameters:
  EnvironmentName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: devops-example

Resources:
  CodePipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-codepipeline-artifacts-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-CodePipelineArtifactsBucket'

Outputs:
  CodePipelineArtifactsBucketName:
    Description: Name of the S3 bucket for CodePipeline artifacts
    Value: !Ref CodePipelineArtifactsBucket
    Export:
      Name: !Sub '${EnvironmentName}-CodePipelineArtifactsBucketName'
